name: Dependency Security Audit
on:
  push:
      branches: [main]
          paths:
                - "package.json"
                      - "package-lock.json"
                        pull_request:
                            paths:
                                  - "package.json"
                                        - "package-lock.json"
                                          workflow_dispatch:
                                            schedule:
                                                - cron: "0 8 * * 1"
                                                jobs:
                                                  audit:
                                                      name: npm audit
                                                          runs-on: ubuntu-latest
                                                              steps:
                                                                    - name: Checkout
                                                                            uses: actions/checkout@v4
                                                                                  - name: Set up Node.js
                                                                                          uses: actions/setup-node@v4
                                                                                                  with:
                                                                                                            node-version: "20"
                                                                                                                      cache: "npm"
                                                                                                                            - name: Install dependencies
                                                                                                                                    run: npm ci
                                                                                                                                          - name: Run security audit (fail on high/critical)
                                                                                                                                                  run: npm audit --audit-level=high
                                                                                                                                                        - name: Show full audit report on failure
                                                                                                                                                                if: failure()
                                                                                                                                                                        run: npm audit --audit-level=high || true
